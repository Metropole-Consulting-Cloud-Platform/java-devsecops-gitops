stages:
  - test
  - security
  - package
  - image-scan
  - gitops

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  MAVEN_CLI_OPTS: "--batch-mode --no-transfer-progress"

cache:
  key: maven-${CI_COMMIT_REF_SLUG}
  paths:
    - .m2/repository/

maven-test:
  stage: test
  image: maven:3.9.9-eclipse-temurin-21
  script:
    - cd app
    - mvn $MAVEN_CLI_OPTS verify
  artifacts:
    when: always
    reports:
      junit: app/target/surefire-reports/TEST-*.xml

semgrep:
  stage: security
  image: semgrep/semgrep:1.127.0
  script:
    - semgrep scan --config auto --error app/src

trivy-filesystem:
  stage: security
  image:
    name: aquasec/trivy:0.65.0
    entrypoint: [""]
  script:
    - trivy fs --scanners vuln,secret,misconfig --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 .

container-build:
  stage: package
  image: docker:27.5.1-cli
  services:
    - name: docker:27.5.1-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
  script:
    - docker build -f docker/Dockerfile -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA" .
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

trivy-image:
  stage: image-scan
  image:
    name: aquasec/trivy:0.65.0
    entrypoint: [""]
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | trivy registry login --username "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

update-gitops-image:
  stage: gitops
  image: alpine/git:2.49.1
  script:
    - sed -i "s|name: ghcr.io/asimshahibm/java-devsecops-gitops|name: ${CI_REGISTRY_IMAGE}|" k8s/base/kustomization.yaml
    - sed -i "s|newTag: .*|newTag: ${CI_COMMIT_SHA}|" k8s/base/kustomization.yaml
    - git config user.name "GitLab CI"
    - git config user.email "gitlab-ci@${CI_SERVER_HOST}"
    - git add k8s/base/kustomization.yaml
    - git diff --cached --quiet || git commit -m "chore(gitops): deploy image ${CI_COMMIT_SHA}"
    - git remote set-url origin "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
    - git push origin "HEAD:ci/gitops-image"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
