name: Java DevSecOps

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: app/pom.xml
      - name: Test and package
        working-directory: app
        run: mvn --batch-mode --no-transfer-progress verify

  semgrep:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Semgrep
        run: python -m pip install --disable-pip-version-check semgrep
      - name: Scan Java source
        run: semgrep scan --config p/java --error app/src

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  source-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Scan source, dependencies, secrets, and configuration
        uses: aquasecurity/trivy-action@0.32.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  publish-image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - test
      - semgrep
      - source-scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.meta.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=long,prefix=sha-
      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Scan published image
        uses: aquasecurity/trivy-action@0.32.0
        with:
          image-ref: ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.version }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  propose-gitops-update:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: publish-image
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out desired state
        uses: actions/checkout@v4
      - name: Update Kubernetes image tag
        env:
          IMAGE_TAG: ${{ needs.publish-image.outputs.image-tag }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import re

          path = Path("k8s/base/kustomization.yaml")
          content = path.read_text()
          updated, replacements = re.subn(
              r"(?m)^(\s*newTag:\s*).+$",
              lambda match: match.group(1) + os.environ["IMAGE_TAG"],
              content,
              count=1,
          )
          if replacements != 1:
              raise SystemExit("Expected exactly one newTag entry in kustomization.yaml")
          path.write_text(updated)
          PY
      - name: Open GitOps pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/update-gitops-image
          delete-branch: true
          add-paths: k8s/base/kustomization.yaml
          commit-message: "chore(gitops): deploy image ${{ needs.publish-image.outputs.image-tag }}"
          title: "chore(gitops): deploy image ${{ needs.publish-image.outputs.image-tag }}"
          body: |
            Updates the Kubernetes desired state to the image built and scanned
            from commit ${{ github.sha }}. Merge this pull request to let Argo CD
            deploy it to the cluster.
          signoff: false
